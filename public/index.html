
<!-- public/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat Multicast - Node.js</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Chat Multicast</h1>
    <div id="user-count">Conectados: {{ data.userCount }}</div>
  </header>

  <main class="main-area">
    <aside class="sidebar">
      <h3>Usuarios</h3>
      <ul class="user-list">
      </ul>
    </aside>

    <section class="chat-area">
      <ul class="messages"></ul>

      <form class="form-chat" action="">
        <input class="input-form-chat" autocomplete="off" placeholder="Escribe un mensaje..." />
        <button>Enviar</button>
      </form>
    </section>
  </main>

  <!-- socket.io client (servido por el servidor automáticamente) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
